<svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Spec-driven development process diagram">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5a52"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="420" fill="#f2ede4"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#141c18">How a change ships: spec-driven, agent-built</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="170" height="110" rx="10" fill="#111a16"/>
  <text x="115" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#e6e0d5">1. PRD</text>
  <text x="115" y="120" text-anchor="middle" font-size="11" fill="#a7b0a9">Product requirements,</text>
  <text x="115" y="136" text-anchor="middle" font-size="11" fill="#a7b0a9">FR-NN functional</text>
  <text x="115" y="152" text-anchor="middle" font-size="11" fill="#a7b0a9">requirements</text>

  <line x1="200" y1="125" x2="234" y2="125" stroke="#4b5a52" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 2 -->
  <rect x="238" y="70" width="170" height="110" rx="10" fill="#1c2722"/>
  <text x="323" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#e6e0d5">2. openspec.yaml</text>
  <text x="323" y="120" text-anchor="middle" font-size="11" fill="#a7b0a9">Roadmap + hard</text>
  <text x="323" y="136" text-anchor="middle" font-size="11" fill="#a7b0a9">constraints (a11y,</text>
  <text x="323" y="152" text-anchor="middle" font-size="11" fill="#a7b0a9">upload security)</text>

  <line x1="408" y1="125" x2="442" y2="125" stroke="#4b5a52" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 3 -->
  <rect x="446" y="70" width="190" height="110" rx="10" fill="#1c2722"/>
  <text x="541" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#e6e0d5">3. Change proposal</text>
  <text x="541" y="120" text-anchor="middle" font-size="11" fill="#a7b0a9">proposal · design ·</text>
  <text x="541" y="136" text-anchor="middle" font-size="11" fill="#a7b0a9">tasks · specs/ with</text>
  <text x="541" y="152" text-anchor="middle" font-size="11" fill="#a7b0a9">SHALL/WHEN/THEN</text>

  <line x1="636" y1="125" x2="670" y2="125" stroke="#4b5a52" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 4 -->
  <rect x="674" y="70" width="190" height="110" rx="10" fill="#8bc34a"/>
  <text x="769" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#141c18">4. Agent build wave</text>
  <text x="769" y="120" text-anchor="middle" font-size="11" fill="#1c2722">Time-boxed, scoped</text>
  <text x="769" y="136" text-anchor="middle" font-size="11" fill="#1c2722">runs (e.g. wave-1 API,</text>
  <text x="769" y="152" text-anchor="middle" font-size="11" fill="#1c2722">wave-2 UI/PWA)</text>

  <!-- down arrow from step 4 to step 5 -->
  <line x1="769" y1="180" x2="769" y2="214" stroke="#4b5a52" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 5 -->
  <rect x="674" y="218" width="190" height="90" rx="10" fill="#111a16"/>
  <text x="769" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#e6e0d5">5. Gates</text>
  <text x="769" y="266" text-anchor="middle" font-size="11" fill="#a7b0a9">lint · typecheck ·</text>
  <text x="769" y="282" text-anchor="middle" font-size="11" fill="#a7b0a9">test · build — all four</text>

  <line x1="674" y1="263" x2="640" y2="263" stroke="#4b5a52" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 6 -->
  <rect x="446" y="218" width="190" height="90" rx="10" fill="#1c2722"/>
  <text x="541" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#e6e0d5">6. Deploy</text>
  <text x="541" y="266" text-anchor="middle" font-size="11" fill="#a7b0a9">Vercel (app + server) ·</text>
  <text x="541" y="282" text-anchor="middle" font-size="11" fill="#a7b0a9">GitHub Pages (docs)</text>

  <line x1="446" y1="263" x2="412" y2="263" stroke="#4b5a52" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 7 -->
  <rect x="216" y="218" width="190" height="90" rx="10" fill="#1c2722"/>
  <text x="311" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#e6e0d5">7. Review live</text>
  <text x="311" y="266" text-anchor="middle" font-size="11" fill="#a7b0a9">check against design</text>
  <text x="311" y="282" text-anchor="middle" font-size="11" fill="#a7b0a9">(docs/figmamake) + PRD</text>

  <!-- loop back arrow to step 3 -->
  <path d="M 311 218 C 311 180, 420 150, 446 125" fill="none" stroke="#4b5a52" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>
  <text x="330" y="175" font-size="10" fill="#4b5a52">next change</text>

  <!-- Gates band note -->
  <rect x="30" y="330" width="920" height="60" rx="10" fill="#f2ede4" stroke="#141c18" stroke-width="1.5"/>
  <text x="50" y="353" font-size="12" font-weight="700" fill="#141c18">Standing constraints checked at every step:</text>
  <text x="50" y="373" font-size="12" fill="#4b5a52">mobile-first + WCAG 2.2 AA · uploads go through the shared security/quarantine pipeline · no inferred measurement claimed as exact</text>
</svg>
